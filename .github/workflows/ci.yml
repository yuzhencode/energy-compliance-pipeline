name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       energy_compliance_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST:     localhost
      DB_PORT:     5432
      DB_NAME:     energy_compliance_test
      DB_USER:     postgres
      DB_PASSWORD: postgres
      OUTPUT_DIR:  outputs
      LOG_LEVEL:   INFO

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PostgreSQL client      # fixes "psql: command not found" on ubuntu-latest
        run: sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run schema migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d energy_compliance_test -f sql/schema.sql

      - name: Seed test data
        run: python seeds/generate_seeds.py --rows 200

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke test — run full pipeline (no S3)
        run: python run_pipeline.py --no-upload

  deploy:
    name: Deploy — upload report to S3
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       energy_compliance
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST:     localhost
      DB_PORT:     5432
      DB_NAME:     energy_compliance
      DB_USER:     postgres
      DB_PASSWORD: postgres
      OUTPUT_DIR:  outputs
      LOG_LEVEL:   INFO

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-2

      - name: Run schema migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d energy_compliance -f sql/schema.sql

      - name: Seed data
        run: python seeds/generate_seeds.py --rows 500

      - name: Run pipeline and upload to S3
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION:    eu-west-2
        run: python run_pipeline.py
